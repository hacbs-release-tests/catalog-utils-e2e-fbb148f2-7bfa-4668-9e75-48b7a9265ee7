---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup-internal-requests
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to delete internal requests associated with a pipelinerun
  params:
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. It is only available at the pipeline level
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  volumes:
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
    securityContext:
      runAsUser: 1001
  steps:
    - name: cleanup-internal-requests
      image: quay.io/redhat-user-workloads-stage/konflux-release-service-tenant/release-service-utils@sha256:c5be2111077064483e7dc84a33238f1a14d858ce16c039b41a0ae34cf9f8bff5
      computeResources:
        limits:
          memory: 192Mi
        requests:
          memory: 192Mi
          cpu: 200m
      command: ["python3"]
      args:
        - -m
        - release_service_utils.tasks.managed.cleanup_internal_requests
        - --pipeline-run-uid
        - "$(params.pipelineRunUid)"
